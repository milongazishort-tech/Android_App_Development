<span class="font-headline-sm text-body-md font-semibold tracking-tight">9:41</span>

</header>

<!-- Screen 4 Title & Subtitle Cluster -->

<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight mb-2">Create Account</h1>
<p class="font-body-md text-body-md text-outline">Start your 30-day transformation</p>
</section>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name Field -->
<div class="relative">
<label class="sr-only" for="full-name">Full Name</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md font-body-md rounded-2xl border border-surface-container-highest focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none shadow-[0_2px_8px_rgba(58,87,232,0.02)]" id="full-name" name="fullname" placeholder="Full Name" required="" type="text">
</div>
<!-- Email Field -->
<div class="relative">
<label class="sr-only" for="email">Email</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full h-[52px] pl-11 pr-4 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md font-body-md rounded-2xl border border-surface-container-highest focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none shadow-[0_2px_8px_rgba(58,87,232,0.02)]" id="email" name="email" placeholder="Email" required="" type="email">
</div>
<!-- Password Field -->
<div class="relative">
<label class="sr-only" for="password">Password</label>
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-outline">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full h-[52px] pl-11 pr-11 bg-surface-container-lowest text-on-surface placeholder:text-outline text-body-md font-body-md rounded-2xl border border-surface-container-highest focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all outline-none shadow-[0_2px_8px_rgba(58,87,232,0.02)]" id="password" name="password" placeholder="Password" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors cursor-pointer" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>

</div>

<!-- Interactive Password Visibility Toggle Script -->
<script>
    function setupPasswordToggle(buttonId, inputId) {
      const button = document.getElementById(buttonId);
      const input = document.getElementById(inputId);
      if (!button || !input) return;

      button.addEventListener('click', () => {
        const iconSpan = button.querySelector('.material-symbols-outlined');
        const isPassword = input.getAttribute('type') === 'password';
        
        if (isPassword) {
          input.setAttribute('type', 'text');
          iconSpan.textContent = 'visibility_off';
          iconSpan.setAttribute('data-icon', 'visibility_off');
        } else {
          input.setAttribute('type', 'password');
          iconSpan.textContent = 'visibility';
          iconSpan.setAttribute('data-icon', 'visibility');
        }
      });
    }

    setupPasswordToggle('togglePassword', 'password');
    setupPasswordToggle('toggleConfirmPassword', 'confirm-password');
  </script>
