      display: inline-block;
      vertical-align: middle;
      line-height: 1;
    }
    @keyframes pulseDot {
      0%, 80%, 100% {
        transform: scale(0.75);
        opacity: 0.35;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
    .dot-1 { animation: pulseDot 1.4s infinite ease-in-out; }
    .dot-2 { animation: pulseDot 1.4s infinite ease-in-out 0.2s; }
    .dot-3 { animation: pulseDot 1.4s infinite ease-in-out 0.4s; }

<body class="bg-surface-container-high min-h-screen flex items-center justify-center p-0 md:p-6 text-on-surface antialiased font-body-md select-none">
<!-- Mobile Viewport Canvas Container matching 1. Splash Screen -->
<div class="relative w-full max-w-[400px] h-[844px] bg-gradient-to-b from-surface via-surface-bright to-surface-container-low rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border-[6px] border-surface-container-lowest">
<!-- Top Decorative Ambient Glow -->
<div class="absolute -top-24 -left-20 w-72 h-72 bg-primary-fixed/40 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute top-1/3 -right-24 w-60 h-60 bg-surface-variant/50 rounded-full blur-3xl pointer-events-none"></div>
<!-- Status Bar (iOS standard 9:41 layout) -->
<header class="relative z-10 w-full pt-3 px-7 flex justify-between items-center text-on-surface">
<div class="font-headline-sm text-headline-sm font-bold tracking-tight">9:41</div>
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-[17px] leading-none">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[17px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[20px] leading-none">battery_full</span>
</div>
</header>
<!-- Main Branding & Identity Hero (Screen 1 Core) -->
<main class="relative z-10 flex flex-col items-center justify-center px-6 mt-6">
<!-- Logo Target / Eye / Observation Geometric Glyph -->
<div class="relative mb-5 flex items-center justify-center">
<!-- Ambient subtle glow behind logo -->
<div class="absolute inset-0 bg-primary-container/20 rounded-full blur-xl scale-125"></div>
<div class="relative w-24 h-24 rounded-full bg-surface-container-lowest shadow-[0_10px_25px_-4px_rgba(58,87,232,0.22)] flex items-center justify-center p-3 border border-surface-container">
<!-- Concentric Observation Rings SVG -->
<svg class="w-full h-full" fill="none" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<!-- Outer Ring -->
<circle cx="50" cy="50" r="42" stroke="#3A57E8" stroke-dasharray="190 25" stroke-linecap="round" stroke-width="6"></circle>
<!-- Middle Tinted Ring -->
<circle cx="50" cy="50" r="30" stroke="#BAC3FF" stroke-width="4.5"></circle>
<!-- Inner Solid Iris Target -->
<circle cx="50" cy="50" fill="#173BD0" r="18"></circle>
<!-- Centered Pupil Focus -->
<circle cx="50" cy="50" fill="#FAF8FF" r="8"></circle>
<circle cx="47" cy="47" fill="#3A57E8" r="2.5"></circle>
</svg>
</div>
</div>
<!-- App Title -->

        Student Life<br>
<span class="text-primary-container">Observation</span>
</h1>
<!-- Slogan -->
<p class="mt-2 font-label-md text-label-md text-outline font-medium tracking-wide text-center">
        Observe Today. Improve Tomorrow.
      </p>
<!-- Student Illustration Graphic (Wireframe 1) -->
<div class="mt-7 w-full max-w-[290px] relative flex flex-col items-center">

<div class="absolute -top-3 left-4 w-7 h-7 rounded-lg bg-surface-container flex items-center justify-center text-primary shadow-sm rotate-[-10deg]">
<span class="material-symbols-outlined text-[16px]">menu_book</span>
</div>
<div class="absolute top-2 right-4 w-7 h-7 rounded-full bg-secondary-fixed/50 flex items-center justify-center text-secondary shadow-sm rotate-[12deg]">

</div>
<div class="absolute -bottom-1 left-2 w-6 h-6 rounded-full bg-tertiary-fixed/60 flex items-center justify-center text-tertiary rotate-[6deg]">
